[package]
name = "panic_abort"
version = "0.0.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rust-lang/rust.git"
description = "Implementation of Rust panics via process aborts"
edition = "2024"

[lib]
test = false
bench = false
doc = false

[dependencies]
core = { path = "../rustc-std-workspace-core", package = "rustc-std-workspace-core" }

[target.'cfg(target_os = "android")'.dependencies]
libc = { version = "0.2", default-features = false }

[target.'cfg(any(target_os = "android", target_os = "zkvm"))'.dependencies]
alloc = { path = "../alloc" }

[target.'cfg(target_os = "nanvix")'.dependencies]
syscall = { git = "https://github.com/nanvix/nanvix", branch = "nanvix/v0.8.x", package = "syscall", default-features = false, features = [
    "syscall",
    'rustc-dep-of-std',
] }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(bootstrap)', 'cfg(target_os, values("nanvix"))']

